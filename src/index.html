<body>
<style>
    body {font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; touch-action: manipulation;}
    #b {display: grid; grid-template-columns: repeat(5, 45px); gap: 5px; margin-bottom: 20px;}
    .t {width: 45px; height: 45px; border: 2px solid #3a3a3c; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold;}
    .k {display: flex; flex-direction: column; gap: 6px; align-items: center; width: 100%; max-width: 400px;}
    .r {display: flex; gap: 4px; width: 100%; justify-content: center;}
    button {background: #818384; color: #fff; border: 0; padding: 0; height: 45px; flex: 1; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px;}
    button.w {flex: 1.5;}
    .c {background: #538d4e;}
    .p {background: #b59f3b;}
    .a {background: #3a3a3c;}
    canvas {position: fixed; inset: 0; pointer-events: none;}
  </style>
  <h1 style="margin: 0 0 10px 0;">uri wordle</h1>
  <div id="b"></div>
  <div class="k" id="k"></div>
  <canvas id="v"></canvas>
  <script>
    const words = ["REACT", "MOUSE", "PLANT", "SMILE", "TRAIN", "WATER"];
    const target = words[Math.floor(Math.random()*words.length)];

    let row = 0, col = 0, r = 6, c = 5, guess = '';
    const bDiv = document.getElementById('b');
    const kDiv = document.getElementById('k');

    bDiv.innerHTML = '<div class=t></div>'.repeat(r*c);

    const keys = ["QWERTYUIOP", "ASDFGHJKL", "⌫ZXCVBNM↵"];
    keys.forEach((layer, rIdx) => {
      let rowDiv = document.createElement('div');
      rowDiv.className = 'r';
      [...layer].forEach(key => {
        let btn = document.createElement('button');
        btn.textContent = key;
        if (key === '⌫' || key === '↵') btn.className = 'w';
        btn.onclick = () => handleInput(key === '⌫' ? 'Backspace' : key === '↵' ? 'Enter' : key);
        rowDiv.appendChild(btn);
      });
      kDiv.appendChild(rowDiv);
    });

    window.onkeydown = e => handleInput(e.key);

    function handleInput(key) {
      if ((key === 'Backspace' || key === '⌫') && col > 0) {
        guess = guess.slice(0, -1);
        bDiv.children[row*c+--col].textContent = '';
      } else if((key === 'Enter' || key === '↵') && col === c) {
        for(let i=0; i<c; i++) {
          let t = bDiv.children[row*c+i];
          t.classList.add(guess[i] === target[i] ? 'c' : target.includes(guess[i]) ? 'p' : 'a');
          updateKeyColor(guess[i], t.className);
        }
        row++; col = 0;
        if(guess === target) return win();
        guess = '';
        if(row === r) return setTimeout(() => alert('game over twin; the word was ' + target), 50);
      } else if (/^[a-zA-Z]$/.test(key) && col < c) {
        let letter = key.toUpperCase();
        bDiv.children[row*c+col++].textContent = letter;
        guess += letter;
      }
    }

    function updateKeyColor(letter, tileClass) {
      let color = tileClass.slice(-1), b = [...kDiv.getElementsByTagName('button')].find(b => b.textContent === letter);
      if(color === 'c' || b.className !== 'c' && (color === 'p' || b.className !== 'p')) b.className = color;
    }

    function win() {
      let a = new (window.AudioContext || window.webkitAudioContext)();
      [261.6, 329.6, 392.0, 523.3].forEach((f, i) => setTimeout(() => {
        let o = a.createOscillator(), g = a.createGain();
        o.connect(g); g.connect(a.destination); o.frequency.value = f;
        g.gain.setValueAtTime(0.1, a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, a.currentTime + 0.4);
        o.start(); o.stop(a.currentTime + 0.4);
      }, i * 120));

      let cv = document.getElementById('v'), ctx = cv.getContext('2d');
      cv.width = window.innerWidth; cv.height = window.innerHeight;
      let p = [];
      for(let i = 0; i < 150; i++) {
        p.push([cv.width/2,cv.height/2,(Math.random()-0.5)*14,(Math.random()-0.5)*15-6,`hsl(${Math.random()*360},90%,60%)`]);
      }

      function loop() {
        ctx.clearRect(0,0,cv.width, cv.height);
        p.forEach(i => {
          i[0] += i[2]; i[1] += i[3]; i[3] += 0.2;
          ctx.fillStyle = i[4]; ctx.fillRect(i[0], i[1], 6, 6);
        });
        requestAnimationFrame(loop);
      }
      loop();
      setTimeout(() => alert('you win. yay.'), 1800);
    }
  </script>
</body>
